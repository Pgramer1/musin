# Musin pipeline configuration: every setting that CHANGES RESULTS.
# Contract: PRD §8.4. Secrets and per-machine settings go in .env (PRD §8.5).
#
# Rules (PRD §8.4):
#   - No hidden defaults: code fails loudly if a key is missing.
#   - G1 resolved the provisional values (D-039, D-040).
#   - Changing a value under filters/credits/contributions/genres/
#     analysis needs a decision entry and a re-run of every affected stage.
#   - New keys are added in the PR of the feature that needs them, together
#     with the PRD §8.4 listing and src/musin/common/config.py REQUIRED_KEYS.
#   - Sample mode is a CLI flag (--sample <fraction>), not a config key.

snapshot_date: "20261007-002147"     # OD6 (D-013): full-export directory name, YYYYMMDD-HHMMSS

source:                              # MusicBrainz full export (F1.2)
  base_url: https://data.metabrainz.org/pub/musicbrainz/data/fullexport/
  files: [mbdump.tar.bz2, mbdump-derived.tar.bz2]   # core (CC0) + derived (tags, CC BY-NC-SA)
  signing_key_file: config/musicbrainz-signing-key.asc
  signing_key_fingerprint: D5E63B4BDCCE195642948684B8FC2375C777580F

paths:                               # relative to $MUSIN_DATA (§8.5)
  dumps: dumps/
  raw: raw/
  clean: clean/
  graph: graph/
  import: import/
reports_dir: reports/                # relative to the repo root

filters:
  special_artists_file: config/special_artists.csv
  min_recordings: 1                  # OD2 (D-040)
  max_credit_size: 10                # OD3 (D-040)
  include_classical: false           # OD1 (D-039): classical analysed separately, see variants.classical
  use_release_level_credits: false   # OD7 (D-040)
  exclude_artist_types: [Character]  # D-021: artist types left out of the graph (applied in F3.1); [] keeps all

credits:
  featuring_pattern: '(?i)\b(feat|ft|featuring)\b'

contributions:                       # MusicBrainz link_type names, verified against the dump in F2.3
  produced_for: [producer]
  performed_for: [performer, instrument, vocal]

genres:
  mapping_file: config/genre_mapping.csv   # official genre → parent genre (OD4)

years:                               # F2.4 (D-023)
  min_release_year: 1877             # earliest counted release date (phonograph); latest = snapshot year

analysis:
  min_labelled_neighbours: 5
  top_k_bridges: 25
  ego_figures: 3                     # F4.3 (D-038): ego-network figures for the top bridges (RQ1)
  ego_max_neighbours: 150            # F4.3 (D-038): strongest neighbours drawn per ego network
  top_k_overlap: 100
  top_k_centrality: 20               # F4.1 (D-033): top-k list per centrality measure (RQ4)
  pagerank: {damping: 0.85, max_iterations: 1000}   # D-033: a cap, not a target; runs stop at GDS tolerance 1e-7 and must converge
  betweenness_sampling_size: 10000
  betweenness_concurrency: 1         # F4.1 (D-033): sampled betweenness is reproducible only single-threaded
  louvain_runs: 3                    # D-034: stability runs at analysis.concurrency, compared with the run of record
  louvain_concurrency: 1             # F4.2 (D-034): the run of record is single-threaded, hence reproducible
  top_k_communities: 10              # F4.2 (D-034): largest communities described by genre composition (RQ2)
  community_example_artists: 5       # F4.2 (D-034): highest weighted-degree artists listed per described community
  separation_max_paths: 10000        # F4.5 (D-036): shortest paths enumerated per pair before the canonical pick
  random_seed: 42
  concurrency: 4                     # F4.1 (D-033): GDS concurrency for every algorithm except betweenness (fixed, PRD §5.5)
  decades: {from: 1960, to: 2020}

profiling:                           # F1.4 report parameters (D-015); never affect the graph
  min_recordings_grid: [1, 2, 3, 5, 10]   # OD2: node/edge counts at these thresholds
  credit_size_cap: 20                # credit-size histogram: sizes above this form one bucket
  top_k_hubs: 30
  top_k_genres: 150                  # OD4: candidate genres for the parent-genre mapping
  top_k_join_phrases: 30

checks:                              # F3.3 graph-layer quality checks (D-030); never affect the graph
  max_row_change: 0.05               # largest relative row-count change vs the last passing check of the same graph folder

validation:                          # F4.6 (PRD §5.6, D-037): pre-registered cross-genre artists, fixed before RQ1 results
  artists_file: config/validation_artists.csv

variants:                            # F4.7 (D-035): variant graphs for sensitivity runs, built with --variant <name>
  characters:                        # D-021: Character artists kept (RQ1 and RQ4 sensitivity runs)
    filters: {exclude_artist_types: []}
  classical:                         # D-039 (OD1): classical artists kept (RQ1 and RQ4 sensitivity runs)
    filters: {include_classical: true}
