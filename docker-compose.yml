# Musin dev environment (F1.1). Run from WSL2 Ubuntu in the repo root.
#
#   docker compose up -d spark      # Jupyter Lab + PySpark  → http://localhost:8888
#   docker compose up -d neo4j      # Neo4j + GDS            → http://localhost:${NEO4J_HTTP_PORT}
#   docker compose exec spark python -m musin.envcheck --config config/pipeline.yaml
#
# Per-machine values and secrets come from .env (PRD §8.5); a missing key
# stops compose with an error instead of falling back to a default.
# Never run Spark and Neo4j HEAVY jobs at the same time (PRD §7.2): both
# containers may be up, but only one engine should be doing real work.
# All ports are published on 127.0.0.1 only, never on the network.

name: musin

services:
  spark:
    build: docker/spark
    image: musin-spark:f1.1
    env_file: .env
    environment:
      # Inside the container the data root is always /data; this overrides the
      # host path that env_file sets.
      MUSIN_DATA: /data
      # Spark shuffle/spill goes to the WSL filesystem, not the container layer.
      SPARK_LOCAL_DIRS: /data/tmp/spark
      # Bolt address of the neo4j service inside the compose network (F1.5).
      # Fixed wiring, not a per-machine setting; the host port is in .env.
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - .:/workspace
      - ${MUSIN_DATA:?MUSIN_DATA must be set in .env}:/data
    ports:
      - "127.0.0.1:8888:8888"   # Jupyter Lab
      - "127.0.0.1:4040:4040"   # Spark UI (while a SparkSession is running)

  rapids:
    # F5.3 (D-043): RAPIDS cuGraph on the GPU, for musin.benchmark.pagerank_gpu only.
    # Behind the "gpu" profile, so `docker compose up` never starts it; run with
    #   docker compose --profile gpu run --rm rapids python -m musin.benchmark.pagerank_gpu ...
    # Needs the NVIDIA driver on Windows and Docker Desktop's GPU support (WSL2).
    build: docker/rapids
    image: musin-rapids:f5.3
    profiles: [gpu]
    env_file: .env
    environment:
      MUSIN_DATA: /data
      PYTHONPATH: /workspace/src
      HOME: /tmp                  # the image's home belongs to its own user
      CUPY_CACHE_DIR: /tmp/cupy
    # Same UID as the Spark container's user, so results in $MUSIN_DATA stay yours.
    # The image's conda install (/opt/conda) is open to its `conda` group (gid 1001).
    user: "${HOST_UID:-1000}:${HOST_UID:-1000}"
    group_add: ["1001"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ${MUSIN_DATA:?MUSIN_DATA must be set in .env}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  neo4j:
    # neo4j:5.26.30-community with GDS 2.13.12 baked in (see docker/neo4j/Dockerfile).
    build: docker/neo4j
    image: musin-neo4j:f1.1
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:?NEO4J_HEAP_SIZE must be set in .env}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:?NEO4J_HEAP_SIZE must be set in .env}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:?NEO4J_PAGECACHE_SIZE must be set in .env}
    volumes:
      - ${MUSIN_DATA:?MUSIN_DATA must be set in .env}/neo4j/data:/data
      - ${MUSIN_DATA:?MUSIN_DATA must be set in .env}/neo4j/logs:/logs
      - ${MUSIN_DATA:?MUSIN_DATA must be set in .env}/import:/import:ro
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:?NEO4J_HTTP_PORT must be set in .env}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:?NEO4J_BOLT_PORT must be set in .env}:7687"
